<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 max-w-md w-full space-y-6">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-slate-950">Dashboard</h1>
            <p class="text-sm text-slate-500 mt-1">Simple utility tool</p>
        </div>
        
        <div class="border-t border-slate-100 pt-5 space-y-4">
            <div>
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Current Date</h3>
                <p id="date-display" class="text-lg font-medium text-slate-800 mt-1"></p>
            </div>

            <div>
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Random Number Set</h3>
                <div id="numbers-list" class="flex flex-wrap gap-2 mt-2"></div>
            </div>

            <div>
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Rounded Random Number</h3>
                <p id="rounded-display" class="text-2xl font-bold text-blue-600 mt-1"></p>
            </div>
        </div>

        <button id="refresh-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-xl transition duration-200 shadow-sm active:scale-[0.98]">
            Generate New Values
        </button>
    </div>

    <script>
        function updateDashboard() {
            const dateElement = document.getElementById('date-display');
            const listElement = document.getElementById('numbers-list');
            const roundedElement = document.getElementById('rounded-display');

            dateElement.textContent = new Date().toDateString();

            listElement.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const num = Math.random() * 100;
                const badge = document.createElement('span');
                badge.className = 'bg-slate-100 text-slate-700 text-sm font-medium px-3 py-1.5 rounded-lg border border-slate-200';
                badge.textContent = num.toFixed(2);
                listElement.appendChild(badge);
            }

            const rawRandom = Math.random() * 100;
            roundedElement.textContent = Math.round(rawRandom);
        }

        document.getElementById('refresh-btn').addEventListener('click', updateDashboard);
        window.addEventListener('DOMContentLoaded', updateDashboard);
    </script>
</body>
</html>
