<!DOCTYPE html>
<html>

<head>
    <title>ACP8</title>
    <style>
        body {
            background-color: yellow;
            background-image: url("https://images.pexels.com/photos/292442/pexels-photo-292442.jpeg?cs=srgb&dl=beach-dawn-dusk-292442.jpg&fm=jpg");
            background-repeat: no-repeat;
            background-position:top right;
            background-attachment: fixed;
        }
          #grad1 {
            height:400px;
            background-color: red; /* For browsers that do not support gradients*/
            background-image: linear-gradient(to top right,red,orange,yellow,green,blue,indigo,violet);
          }




           /*The animation code */
            @keyframes example {
                0% {background-color: black;}
              25% {background-color: white;}
              50% {background-color: gray;}
              100% {background-color: gold;}
            }
 /* The element to apply the animation to */
 div {
    width: 50px;
    height: 50px;
    background-color: red;
    animation-name: example;
    animation-duration: 4s;
 }

    </style>
</head>

<body>

    </div>
</body>
