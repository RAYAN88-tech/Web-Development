<!DOCTYPE html>
<html>
    <head>
        <title>Basic function </title>
    </head>
    <body>
        <button onclick="myfunction(8,7)">Execute JS fuction</button>
        <script>
            function myfunction(x,y)
            {
                if(y===undefined) {
                    y= 2;
                }
                document.write(x*y);
            }
        </script>
    </body>
</html>
