<!DOCTYPE html>
<html>
<head>
  <title>Simple Layout</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }

    /* Navigation Bar */
    nav {
      background-color: #333;
      padding: 15px;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-size: 18px;
    }

    /* Banner Image Section */
    .banner {
      background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1200');
      height: 300px;
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .banner h1 {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 10px 20px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>

  <!-- Banner Section -->
  <div class="banner">
    <h1>Welcome to My Website</h1>
  </div>

</body>
</html>
