<!DOCTYPE html>
<html>
    <head>
        <title>ACP 12</title>
        <style>
            div {
                background-color:  #3c0ac5;
                padding: 10px;
            }

            div.first {
                opacity:0.1;
            }

            div.second {
                opacity:0.3;
            }

            div.third {
                opacity:0.6;
            }
             div {
                right: 30px;
                border: 3px solid #dae10d;
            }
            div.absolute {
                position: absolute;
                left:50px;
                border: 3px solid orange;
            }
            div.relative {
                position: relative;
                left: 100px;
                border: 3px solid 
            }
            div.fixed {
                position: fixed  #dae10d;
                top: 0;
                right: 20px;
                width: 300px;
                border: 3px solid 
            }
            div.sticky {
                position: sticky #dae10d;
                top: 1px;
                left: 20px;
                width: 100px;
                border: 3px solid  #dae10d;
            }
        </style>
    </head>
    <body>
        <i><h1>The Opacity property:</h1></i>
        
        <p>This is how this property looks:</p>
        
        <div class="first">
            <p></p>opacity 0.1</p>
        </div>
        <div class="second">
            <p>opacity 0.3</p>
        </div>
        <div class="third">
            <p>opacity 0.6</p>
        </div>
        <div>
            <p>opacity 1 (default)</p>
        </div>
        <!--change the position to show the difference
                static
                relative
                fixed
                absolute
                sticky-->
        <i><h2>Positioning</h2></i>
        <div>
            Div with no position property
        </div>
        <div class="sticky">
            Div with sticky position property
        </div>
        <div class="relative">
            This div element has position: relative
            <div class="absolute">
                Absolute class DIV
            </div>
        </div>
        <div class="fixed">
            Div with fixed position property
        </div>

</html>
