<!DOCTYPE html>
<html>
    <body>

        <p>Finding the largest number with help of Arguments Objects</p>
        <p id="result"></p>
        <script>
            function findMax() {
                var i;
                var max = 0;
                for(i = 0; i < arguments.length; i++) {
                    if (arguments[i] > max) {
                        max = arguments[i];
                    }
                }
                return max;
            }

            document.getElementById("result").innerHTML = findMax(8,7,11,9);
        </script>
    </body>
</html>
