<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CSS Box Model Example</title>
    <style type="text/css">
        .example1 {
            width: 220px;
            background-color: rgb(121, 121, 103);
            padding: 0px;
            border: 0px;
            margin: 0px;
        }

        .example2 {
            width: 220px;
            background-color: rgb(75, 0, 237);
            padding: 50px;
            border: 5px solid rgb(192, 0, 0);
            margin: 40px 20px;
        }

        hr {
            background-color: rgb(0, 255, 89);
        }
            img#flowerRight{
                float:right
            }
            img#flowerLeft{
                float:left
            }
    </style>
</head>

<body>
    <h1>Box Model Example</h1>
    <hr>
    <p class="example1">My Content Example</p>
    <hr style="height: 15px; color:blue;">
    <p class="example2">My content Example 2</p>
    <hr style="height: 17px;color:blue">
    <i><h2>Floating:</h2></i>
    <p>In this example, the image will float to the right in the paragraph, and the text in the paragraph will wrap around
        the image.</p>
    <p>
        <img id="flowerRight" src="PurpleFlower.jpg" alt="tree" style="width:100px;height:100px;">
        <img id="flowerLeft" src="PurpleFlower.jpg" alt="tree" style="width:100px;height:100px;">
        This is a dummy content used to understand the float property
    </p>
</body>

</html>
